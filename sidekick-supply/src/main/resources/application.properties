spring.application.name=sidekick-supply
spring.datasource.url=${SIDEKICK_DATASOURCE_URL:jdbc:postgresql://localhost:5433/sidekick_supply}
spring.datasource.username=${SIDEKICK_DATASOURCE_USERNAME:sidekick}
spring.datasource.password=${SIDEKICK_DATASOURCE_PASSWORD:sidekick}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
