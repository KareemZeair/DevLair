services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devlair
      POSTGRES_USER: devlair
      POSTGRES_PASSWORD: devlair
    ports:
      - "5432:5432"
    volumes:
      - devlair-postgres-data:/var/lib/postgresql/data
  sidekick-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sidekick_supply
      POSTGRES_USER: sidekick
      POSTGRES_PASSWORD: sidekick
    ports:
      - "5433:5432"
    volumes:
      - sidekick-postgres-data:/var/lib/postgresql/data

volumes:
  devlair-postgres-data:
  sidekick-postgres-data:
